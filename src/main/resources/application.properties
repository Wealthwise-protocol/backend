# ======================================
# APPLICATION
# ======================================

spring.config.import=optional:file:.env[.properties]
spring.application.name=wealthwise-backend
server.port=${PORT:9095}

# ======================================
# DEVTOOLS
# ======================================

spring.devtools.restart.enabled=false

# ======================================
# NEON POSTGRES DATABASE
# ======================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================
# CONNECTION POOL (HIKARI)
# ======================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.max-lifetime=1800000

# ======================================
# JPA / HIBERNATE
# ======================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ======================================
# LOGGING
# ======================================

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# ======================================
# CORS (FOR REACT FRONTEND)
# ======================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://frontend.sathyamrock55.workers.dev,https://dev-wealthwise.sathyam.xyz,https://wealthwise.sathyam.xyz}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*

# ======================================
# EMAIL (RESEND)
# ======================================

# RESEND_API_KEY and MAIL_FROM are set via environment variables

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ======================================
# JWT
# ======================================

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ======================================
# OPENAI
# ======================================

spring.cache.type=simple

openai.api-key=${OPENAI_API_KEY}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-4o}
