# ======================================
# APPLICATION
# ======================================

spring.application.name=wealthwise-backend
server.port=${PORT:9095}

# ======================================
# DEVTOOLS
# ======================================

spring.devtools.restart.enabled=false

# ======================================
# NEON POSTGRES DATABASE
# ======================================

spring.datasource.url=${DB_URL:jdbc:postgresql://ep-calm-paper-adsxz8lc-pooler.c-2.us-east-1.aws.neon.tech/wealthwise_db?sslmode=require&channelBinding=prefer}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_VihaSsLJ7R3r}
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================
# CONNECTION POOL (HIKARI)
# ======================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.max-lifetime=1800000

# ======================================
# JPA / HIBERNATE
# ======================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ======================================
# LOGGING
# ======================================

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# ======================================
# CORS (FOR REACT FRONTEND)
# ======================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://frontend.sathyamrock55.workers.dev}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*

# ======================================
# EMAIL (SMTP)
# ======================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:sathyamrock55@gmail.com}
spring.mail.password=${MAIL_PASSWORD:yppgtccavznaopla}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ======================================
# JWT
# ======================================

security.jwt.secret=${JWT_SECRET:wealthwise-super-secret-jwt-key-change-in-production-1234567890}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
