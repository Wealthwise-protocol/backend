services:
  - type: web
    name: wealthwise-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://frontend.sathyamrock55.workers.dev"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: "https://frontend.sathyamrock55.workers.dev,http://localhost:5173"
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
