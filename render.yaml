services:
  - type: web
    name: wealthwise-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://frontend.sathyamrock55.workers.dev"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SMTP_STARTTLS_ENABLE
        value: "true"
      - key: MAIL_SMTP_STARTTLS_REQUIRED
        value: "true"
      - key: MAIL_SMTP_SSL_ENABLE
        value: "false"
      - key: MAIL_SMTP_CONNECTION_TIMEOUT
        value: "10000"
      - key: MAIL_SMTP_TIMEOUT
        value: "10000"
      - key: MAIL_SMTP_WRITE_TIMEOUT
        value: "10000"
      - key: FRONTEND_URL
        value: "https://frontend.sathyamrock55.workers.dev"
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
